[package]
name = "dropflip"
version = "0.1.0"
edition = "2021"
description = "A quiet desktop drop zone for local file conversion"
license = "MIT"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "tga", "pnm", "qoi", "hdr", "dds"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
csv = "1"
tiff = "=0.11.3"
calamine = { version = "=0.37.0", features = ["chrono"] }
rust_xlsxwriter = { version = "=0.101.0", features = ["constant_memory"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
lopdf = "0.46"
directories = "6"
tempfile = "3"
anyhow = "1"
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Com"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
