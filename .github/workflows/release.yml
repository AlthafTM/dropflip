name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/release.yml', 'installer/**', 'scripts/package-release.ps1', 'scripts/setup-installer.ps1', 'scripts/test-package.ps1']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure toolchain and validate version
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-rc\.\d+)?$') { throw 'Invalid package version' }
          if ($env:RELEASE_REF.StartsWith('refs/tags/') -and $env:RELEASE_TAG -ne "v$version") { throw 'Tag and Cargo version differ' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          $rc = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin/*/x64/rc.exe' | Sort-Object FullName | Select-Object -Last 1
          if (-not $rc) { throw 'Windows resource compiler missing' }
          $rc.DirectoryName >> $env:GITHUB_PATH
          rustup toolchain install stable --profile minimal --component rustfmt
          if ($LASTEXITCODE) { throw 'Rust setup failed' }
          rustup default stable
          if ($LASTEXITCODE) { throw 'Rust selection failed' }
      - run: cargo fmt -- --check
      - run: cargo test --locked --target x86_64-pc-windows-msvc
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file Cargo.lock
      - name: Build portable ZIP and installer
        shell: pwsh
        run: |
          ./scripts/setup-installer.ps1
          ./scripts/package-release.ps1 -BinaryPath target/x86_64-pc-windows-msvc/release/dropflip.exe
      - name: Test portable app, installation and uninstall
        shell: pwsh
        run: |
          ./scripts/test-package.ps1 -ReleaseDirectory "dist/$env:RELEASE_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dropflip-windows-x64-${{ github.sha }}
          path: |
            dist/*/*.zip
            dist/*/*-setup.exe
            dist/*/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dropflip-windows-x64-${{ github.sha }}
          path: release
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: release/**/*
      - name: Publish verified tag assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]
          mapfile -d '' assets < <(find release -type f \( -name '*.zip' -o -name '*-setup.exe' -o -name 'SHA256SUMS.txt' \) -print0)
          [[ ${#assets[@]} -eq 3 ]]
          checksum_file=$(find release -name SHA256SUMS.txt -print -quit)
          (cd "$(dirname "$checksum_file")" && sha256sum --check SHA256SUMS.txt)
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            [[ "$state" == true ]] || { echo 'Refusing to replace a published release'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Dropflip $RELEASE_TAG" --generate-notes --notes 'Windows x64. Download the portable ZIP, extract it, and run Dropflip.exe. The setup.exe is an optional per-user installer. These compact packages contain the native app; external conversion engines are installed separately. See README and SECURITY.md. Binaries are unsigned; SHA256SUMS.txt and GitHub build attestations are provided.'
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
